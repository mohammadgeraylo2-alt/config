<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل</title>
<style>
:root{--bg:#0d1b21;--sf:#15272f;--ln:#24404a;--tx:#e9f0ea;--mu:#8fa8ad;--ac:#f0b648;--ok:#46c2a8;--er:#e5604f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 Vazirmatn,Tahoma,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 16px}
input,button{font:inherit;border-radius:8px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);padding:10px 12px}
button{cursor:pointer}button.p{background:var(--ac);color:#1b1405;border-color:var(--ac);font-weight:700}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.row input{flex:1;min-width:110px}
.u{background:var(--sf);border:1px solid var(--ln);border-right:4px solid var(--ok);border-radius:10px;padding:12px;margin-bottom:10px}
.u.off{border-right-color:var(--er);opacity:.75}
.u b{font-size:16px}.m{color:var(--mu);font-size:13px}
.bar{height:6px;background:var(--ln);border-radius:3px;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.u button{padding:6px 10px;font-size:13px}
#qr{position:fixed;inset:0;background:#000c;display:none;place-items:center}#qr img{background:#fff;padding:12px;border-radius:12px;width:260px}
#err{color:var(--er);min-height:24px}
</style></head><body><main>
<div id="L"><h1>ورود به پنل</h1>
<div class="row"><input id="u" placeholder="نام کاربری" autocomplete="username"><input id="p" type="password" placeholder="رمز عبور" autocomplete="current-password"></div>
<button class="p" onclick="login()">ورود</button><div id="err"></div></div>
<div id="A" hidden><h1>کاربران</h1>
<div class="row"><input id="n" placeholder="نام"><input id="g" type="number" placeholder="حجم (گیگ، خالی = نامحدود)"><input id="d" type="number" placeholder="روز (خالی = نامحدود)"><button class="p" onclick="add()">ساخت کاربر</button></div>
<div id="T"></div>
<div class="row"><a href="/api/backup"><button>دریافت پشتیبان</button></a>
<button onclick="f.click()">بازگردانی پشتیبان</button><input id="f" type="file" accept=".json" hidden onchange="rest()"></div></div>
<div id="qr" onclick="this.style.display='none'"><img id="qi" alt="کد پاسخ سریع"></div>
</main><script>
const $=i=>document.getElementById(i),J=(u,m='GET',b)=>fetch(u,{method:m,headers:{'content-type':'application/json'},body:b&&JSON.stringify(b)});
const gb=x=>(x/2**30).toFixed(2);
async function login(){const r=await J('/api/in','POST',{u:$('u').value,p:$('p').value});
if(r.ok){$('L').hidden=true;$('A').hidden=false;load()}else $('err').textContent=(await r.json()).detail||'خطا'}
async function load(){const r=await J('/api/users');if(!r.ok){$('L').hidden=false;$('A').hidden=true;return}
$('L').hidden=true;$('A').hidden=false;const {users}=await r.json();$('T').innerHTML=users.map(u=>{const pc=u.gb?Math.min(100,u.used/2**30/u.gb*100):0;
const ex=u.exp?new Date(u.exp*1000).toLocaleDateString('fa-IR'):'نامحدود';
return `<div class="u ${u.alive?'':'off'}"><b>${esc(u.name)}</b> <span class="m">${u.alive?'فعال':'غیرفعال'}</span>
<div class="bar"><i style="width:${pc}%"></i></div>
<div class="m">مصرف ${gb(u.used)} از ${u.gb?u.gb+' گیگ':'نامحدود'} — انقضا: ${ex}</div>
<div class="row" style="margin:8px 0 0"><button onclick="cp('${u.sub}')">کپی لینک</button><button onclick="qr('${u.sub}')">کد پاسخ سریع</button>
<button onclick="a('${u.id}','toggle')">${u.on?'غیرفعال‌سازی':'فعال‌سازی'}</button><button onclick="a('${u.id}','reset')">صفر کردن مصرف</button>
<button onclick="if(confirm('حذف شود؟'))a('${u.id}','del')">حذف</button></div></div>`}).join('')||'<p class="m">هنوز کاربری نساخته‌اید. از فرم بالا اولین کاربر را بسازید.</p>'}
const esc=s=>s.replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
async function add(){await J('/api/users','POST',{name:$('n').value,gb:$('g').value,days:$('d').value});$('n').value=$('g').value=$('d').value='';load()}
async function a(i,x){await J(`/api/users/${i}/${x}`,'POST');load()}
function cp(t){navigator.clipboard.writeText(location.origin+'/s/'+t);alert('لینک کپی شد')}
function qr(t){$('qi').src='/api/qr/'+t;$('qr').style.display='grid'}
async function rest(){const fd=new FormData();fd.append('f',$('f').files[0]);const r=await fetch('/api/restore',{method:'POST',body:fd});alert(r.ok?'بازگردانی شد':'فایل معتبر نیست');load()}
load();
</script></body></html>
