<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0c11">
<title>پنل مدیریت</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" media="print" onload="this.media='all'">
<style>
:root{--bg:#0a0c11;--bg2:#0e1118;--panel:#131722;--panel2:#181d2a;--line:#222a3a;--text:#e9ecf5;--mute:#8d96ab;--acc:#7c5cff;--acc2:#4aa3ff;--ok:#34d399;--warn:#fbbf24;--err:#f87171;--r:16px;--sh:0 10px 30px -14px rgba(0,0,0,.7);--font:"Vazirmatn","Vazir",Tahoma,"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:radial-gradient(1200px 600px at 85% -10%,rgba(124,92,255,.13),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(74,163,255,.09),transparent 60%),var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.7;background-attachment:fixed}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc2);text-decoration:none}
small{color:var(--mute);font-size:12px}
.ltr{direction:ltr;unicode-bidi:plaintext;text-align:left}
.sp{flex:1}
.ic{width:18px;height:18px;flex:none}
/* shell */
.shell{display:flex;min-height:100vh}
.side{width:264px;flex:none;background:linear-gradient(180deg,rgba(19,23,34,.92),rgba(12,15,22,.96));border-inline-end:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;transition:width .25s ease,transform .25s ease;z-index:60;overflow:hidden}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 18px;font-weight:800;font-size:17px;white-space:nowrap}
.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 22px -8px var(--acc);flex:none}
.logo .ic{width:22px;height:22px;color:#fff}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a,.nav button{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--mute);background:none;border:0;cursor:pointer;transition:.2s;white-space:nowrap;text-align:start;width:100%}
.nav a:hover,.nav button:hover{background:var(--panel2);color:var(--text)}
.nav a.on{background:linear-gradient(90deg,rgba(124,92,255,.24),rgba(74,163,255,.1));color:#fff;box-shadow:inset 0 0 0 1px rgba(124,92,255,.38)}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:4px}
.shell.col .side{width:78px}
.shell.col .t,.shell.col .brand b{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:14px 24px;background:rgba(10,12,17,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top h1{font-size:18px;font-weight:700}
.top .menu{display:none}
.view{padding:24px;max-width:1400px;width:100%;margin:0 auto}
.view>*{animation:up .35s ease both}
.scrim{display:none}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{to{background-position:-200% 0}}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;transition:.2s;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#34405a;transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(135deg,var(--acc),#5b7cff);border-color:transparent;color:#fff;box-shadow:0 10px 24px -12px var(--acc)}
.btn.danger{background:rgba(248,113,113,.14);border-color:rgba(248,113,113,.35);color:var(--err)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.loading{position:relative;color:transparent!important}
.btn.loading::after{content:"";position:absolute;width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--mute);cursor:pointer;transition:.2s;position:relative}
.icon-btn:hover{background:var(--panel2);color:var(--text);border-color:var(--line)}
.icon-btn.d:hover{color:var(--err)}
.inp{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;transition:.2s}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(124,92,255,.2)}
.inp[readonly]{color:var(--mute)}
.sel{width:auto;min-width:150px}
select.inp option{background:var(--panel)}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld>span{font-size:13px;color:var(--mute)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.search{position:relative;flex:1;min-width:200px}
.search .ic{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--mute)}
.search .inp{padding-inline-start:38px}
/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card h3{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));margin-bottom:14px}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-bottom:14px}
.stat{display:flex;align-items:center;gap:14px;transition:.25s}
.stat:hover{transform:translateY(-3px);border-color:#33405d}
.stat b{font-size:22px;display:block;line-height:1.3}
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.ico.acc{background:rgba(124,92,255,.16);color:#a590ff}.ico.acc2{background:rgba(74,163,255,.16);color:var(--acc2)}
.ico.ok{background:rgba(52,211,153,.14);color:var(--ok)}.ico.warn{background:rgba(251,191,36,.14);color:var(--warn)}
.ico.err{background:rgba(248,113,113,.14);color:var(--err)}.ico.mute{background:rgba(141,150,171,.14);color:var(--mute)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{background:rgba(52,211,153,.13);color:var(--ok)}.badge.warn{background:rgba(251,191,36,.13);color:var(--warn)}
.badge.err{background:rgba(248,113,113,.13);color:var(--err)}.badge.mute{background:rgba(141,150,171,.13);color:var(--mute)}
.pb{height:7px;border-radius:9px;background:var(--bg2);overflow:hidden;min-width:90px}
.pb i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s ease}
.pb i.warn{background:var(--warn)}.pb i.err{background:var(--err)}
.use small{display:block;margin-top:4px}
/* table */
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:start;color:var(--mute);font-weight:500;font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid rgba(34,42,58,.6);vertical-align:middle}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover{background:rgba(24,29,42,.8)}
.tbl tr[data-href]{cursor:pointer}
.tbl tbody tr:last-child td{border-bottom:0}
.acts{white-space:nowrap;text-align:end}
.cell-user{display:flex;align-items:center;gap:10px}
.cell-user b{display:block;line-height:1.3}
.avatar{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(74,163,255,.25));font-weight:700;flex:none}
.pager{display:flex;align-items:center;justify-content:center;gap:14px;padding-top:14px;color:var(--mute);font-size:13px}
.empty{text-align:center;padding:44px 12px;color:var(--mute)}
.empty .ic{width:44px;height:44px;opacity:.5;margin-bottom:10px}
.empty p{margin-bottom:14px}
.errbox{padding:26px;text-align:center;color:var(--err)}
.sk{border-radius:12px;background:linear-gradient(90deg,var(--panel2) 25%,#202739 50%,var(--panel2) 75%);background-size:200% 100%;animation:shimmer 1.3s infinite;height:48px;margin-bottom:10px}
/* charts */
.tabs{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.tabs button{border:0;background:none;padding:5px 12px;border-radius:9px;color:var(--mute);cursor:pointer;font-size:13px}
.tabs button.on{background:var(--panel2);color:#fff}
.chart-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.chart-h h3{margin:0}
.svg{width:100%;height:auto;direction:ltr;display:block}
.svg .grid{stroke:var(--line);stroke-width:1}
.svg .axl{fill:var(--mute);font-size:10px;font-family:var(--font)}
.legend{display:flex;gap:16px;justify-content:center;color:var(--mute);font-size:12px;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px}
.chart-empty{text-align:center;color:var(--mute);font-size:12px;margin-top:-8px}
/* servers */
.srv-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.srv-h b{display:block;line-height:1.3}
.kv{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv>span:first-child{color:var(--mute)}
.meter{margin:10px 0}.meter div{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:4px}
.srv-err{margin-top:10px;padding:8px 12px;border-radius:10px;background:rgba(248,113,113,.1);color:var(--err);font-size:12px}
.srv-act{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.mini{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(34,42,58,.6)}
.mini:last-child{border:0}
.mini .sp small{display:block}
/* modal */
.modal-wrap{position:fixed;inset:0;background:rgba(4,6,10,.72);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:200;animation:fade .2s}
.modal-wrap.out{opacity:0;transition:.18s}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;width:100%;max-width:480px;max-height:92vh;overflow:auto;box-shadow:0 30px 80px -20px #000;animation:pop .22s ease}
.modal.wide{max-width:700px}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.m-head h3{font-size:16px}
.m-body{padding:20px}
.m-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.form-err{background:rgba(248,113,113,.12);color:var(--err);border-radius:10px;padding:9px 12px;margin-bottom:12px;font-size:13px}
.confirm-msg{margin-bottom:18px;line-height:1.9}
.copy-row{display:flex;gap:8px;margin-bottom:12px}
.copy-row .inp{font-size:12px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(8px)}}
#toasts{position:fixed;bottom:20px;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:300;pointer-events:none}
.toast{background:var(--panel2);border:1px solid var(--line);padding:11px 18px;border-radius:14px;box-shadow:var(--sh);animation:up .25s ease;max-width:90vw}
.toast.ok{border-color:rgba(52,211,153,.5)}.toast.err{border-color:rgba(248,113,113,.55);color:#ffd2d2}
/* notifications */
#np{position:fixed;top:64px;inset-inline-start:20px;width:360px;max-width:calc(100vw - 24px);max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 70px -20px #000;z-index:120;display:none;animation:pop .2s}
#np.show{display:block}
#np .h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.nt{padding:12px 16px;border-bottom:1px solid rgba(34,42,58,.6);display:flex;gap:10px}
.nt.un{background:rgba(124,92,255,.07)}
.nt .dot{width:8px;height:8px;border-radius:50%;margin-top:8px;flex:none}
.dot.info{background:var(--acc2)}.dot.warn{background:var(--warn)}.dot.error{background:var(--err)}
.nt b{display:block;font-weight:600;line-height:1.5}
.bell-n{position:absolute;top:-2px;inset-inline-end:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--err);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:100%;max-width:400px;padding:32px;animation:pop .4s ease}
.login .logo{margin:0 auto 14px;width:56px;height:56px;border-radius:18px}
.login h2{text-align:center;margin-bottom:4px}.login p{text-align:center;color:var(--mute);margin-bottom:24px}
.page-h{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-h h2{font-size:20px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.info .card{padding:14px}.info small{display:block}.info b{font-size:15px}
.hr{height:1px;background:var(--line);margin:14px 0}
@media(max-width:900px){
 .side{position:fixed;inset-block:0;inset-inline-start:0;transform:translateX(100%);width:270px!important}
 .shell.open .side{transform:none}
 .shell.col .t,.shell.col .brand b{display:inline}
 .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:55;opacity:0;pointer-events:none;transition:.25s}
 .shell.open .scrim{opacity:1;pointer-events:auto}
 .top .menu{display:inline-grid}.top{padding:12px 14px}.view{padding:14px}
 #np{inset-inline-start:12px}
}
@media(max-width:760px){
 .tbl thead{display:none}.tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
 .tbl tr{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:6px 12px;background:var(--panel2)}
 .tbl td{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border:0}
 .tbl td::before{content:attr(data-l);color:var(--mute);font-size:12px}
 .tbl td.acts{justify-content:flex-end}.tbl td.acts::before{display:none}
 .row2{grid-template-columns:1fr}.two{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}
 .stat{flex-direction:column;align-items:flex-start;gap:8px}.stat b{font-size:18px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
"use strict";
const BASE="__BASE__",API=BASE+"/api";
const S={admin:null,notifs:[],unread:0};
let nav=0,view=null,autoT=null,notT=null;
const ACT={},PAGES={},LISTS={};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ICONS={
home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',

activity:'<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',
settings:'<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',
logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',

right:'<polyline points="9 18 15 12 9 6"/>',
left:'<polyline points="15 18 9 12 15 6"/>',
clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',

download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
zap:'<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
alert:'<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
sidebar:'<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="15" y1="3" x2="15" y2="21"/>'};
const ic=(n,c="")=>`<svg class="ic ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||""}</svg>`;
/* format */
const nf=new Intl.NumberFormat("fa-IR",{maximumFractionDigits:1}),nf2=new Intl.NumberFormat("fa-IR",{maximumFractionDigits:2});

async function api(method,path,body){
  let r;

  catch{throw new Error("ارتباط با سرور برقرار نشد. اینترنت را بررسی کنید.")}
  let d=null;try{d=await r.json()}catch{}

const niceMax=v=>{if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p};
const lab=(t,r)=>{const d=new Date(t*1000);return r==="24h"?d.toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:TZ}):mfmt.format(d)};
function chartBars(items,r){
  const W=640,H=250,L=10,R=10,T=16,B=30,iw=W-L-R,ih=H-T-B,n=items.length||1;
  const mx=niceMax(Math.max(0,...items.map(i=>i.up+i.down))),bw=iw/n,bar=Math.max(3,Math.min(26,bw*.6)),st=Math.ceil(n/8);let g="";
  for(let k=0;k<=4;k++){const y=T+ih*k/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="grid"/><text x="${L+2}" y="${y-4}" class="axl">${fbytes(mx*(1-k/4))}</text>`}
  items.forEach((it,i)=>{const x=L+i*bw+(bw-bar)/2,hd=ih*it.down/mx,hu=ih*it.up/mx,yd=T+ih-hd,yu=yd-hu;
    g+=`<rect x="${x}" y="${yd}" width="${bar}" height="${hd}" rx="3" fill="var(--acc2)"/><rect x="${x}" y="${yu}" width="${bar}" height="${hu}" rx="3" fill="var(--acc)"/><rect x="${L+i*bw}" y="${T}" width="${bw}" height="${ih}" fill="transparent"><title>${lab(it.t,r)} | دانلود: ${fbytes(it.down)} | آپلود: ${fbytes(it.up)}</title></rect>`;
    if(i%st===0)g+=`<text x="${x+bar/2}" y="${H-9}" class="axl" text-anchor="middle">${lab(it.t,r)}</text>`});
  const none=!items.some(i=>i.up+i.down>0);
  return`<svg viewBox="0 0 ${W} ${H}" class="svg">${g}</svg>${none?'<div class="chart-empty">هنوز مصرفی ثبت نشده است</div>':""}<div class="legend"><span><i style="background:var(--acc2)"></i>دانلود</span><span><i style="background:var(--acc)"></i>آپلود</span></div>`;
}
function chartLine(items){
  const W=640,H=250,L=10,R=10,T=16,B=30,iw=W-L-R,ih=H-T-B,n=items.length;
  const vals=items.map(i=>i.n);let lo=Math.min(...vals),hi=Math.max(...vals);if(hi===lo){hi=lo+1;lo=Math.max(0,lo-1)}
  const px=i=>L+(n>1?iw*i/(n-1):iw/2),py=v=>T+ih-ih*(v-lo)/(hi-lo);let g="";
  for(let k=0;k<=4;k++){const y=T+ih*k/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="grid"/><text x="${L+2}" y="${y-4}" class="axl">${fnum(Math.round(hi-(hi-lo)*k/4))}</text>`}
  const pts=items.map((it,i)=>`${px(i)},${py(it.n)}`).join(" L ");
  g+=`<defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c5cff" stop-opacity=".35"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></linearGradient></defs>`;
  g+=`<path d="M ${px(0)},${T+ih} L ${pts} L ${px(n-1)},${T+ih} Z" fill="url(#gg)"/><path d="M ${pts}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>`;
  const st=Math.ceil(n/8);
  items.forEach((it,i)=>{g+=`<circle cx="${px(i)}" cy="${py(it.n)}" r="4" fill="var(--acc)" opacity="${i===n-1?1:0}"><title>${mfmt.format(new Date(it.t*1000))} | ${fnum(it.n)} کاربر</title></circle><rect x="${px(i)-iw/n/2}" y="${T}" width="${iw/n}" height="${ih}" fill="transparent"><title>${mfmt.format(new Date(it.t*1000))} | ${fnum(it.n)} کاربر</title></rect>`;if(i%st===0)g+=`<text x="${px(i)}" y="${H-9}" class="axl" text-anchor="middle">${mfmt.format(new Date(it.t*1000))}</text>`});
  return`<svg viewBox="0 0 ${W} ${H}" class="svg">${g}</svg>`;
}

};
const serverForm=s=>fld("نام سرور","name",{value:s?.name,ph:"مثلاً سرور اصلی"})+fld("آدرس (دامنه یا IP)","host",{value:s?.host,ltr:1})+`<div class="row2">${fld("پورت","port",{value:s?.port??443,attrs:'inputmode="numeric"'})}${sel("اتصال امن (TLS)","tls",[["1","فعال"],["0","غیرفعال"]],s?String(s.tls):"1")}</div>`+fld("SNI / Host","sni",{value:s?.sni,ltr:1,hint:"خالی = همان آدرس"})+(s&&s.is_local?"":fld("مسیر اتصال","ws_path",{value:s?.ws_path,ltr:1,hint:"خالی = مسیر پیش‌فرض این پنل. برای نقطه ورود جایگزین (مثلاً دامنه پشت CDN که به همین پنل وصل است)."}));
ACT.svNew=()=>formModal("افزودن سرور",serverForm(),"افزودن",async(f,m)=>{await api("POST","/servers",f);m.close();toast("سرور اضافه شد");route()});
ACT.svEdit=d=>{const s=SERVERS.find(x=>x.id==d.id);if(!s)return;formModal("ویرایش سرور",serverForm(s),"ذخیره",async(f,m)=>{await api("PUT","/servers/"+d.id,f);m.close();toast("ذخیره شد");route()})};
ACT.svTest=safe(async(d,el)=>{el.disabled=true;try{const r=await api("POST",`/servers/${d.id}/test`,{});toast(r.status==="online"?`اتصال برقرار است (${fnum(r.latency)} ms)`:"اتصال برقرار نشد: "+r.error,r.status==="online"?"ok":"err");route()}finally{el.disabled=false}});
ACT.svTestAll=safe(async(d,el)=>{el.disabled=true;try{for(const s of SERVERS)await api("POST",`/servers/${s.id}/test`,{});toast("بررسی انجام شد");route()}finally{el.disabled=false}});
ACT.svDel=safe(async d=>{if(!await confirmBox(`سرور «${d.n}» حذف شود؟`))return;await api("DELETE","/servers/"+d.id);toast("سرور حذف شد");route()});
/* ---------- reports ---------- */
PAGES.reports=async my=>{
  const d=await api("GET","/reports/top");if(my!==nav)return;setTitle("آمار و گزارش‌ها");
  const st=d.states,tot=Object.values(st).reduce((a,b)=>a+b,0)||1;
  view.innerHTML=`<div class="toolbar"><div class="sp"></div><button class="btn" data-act="exUsers">${ic("download")}<span>خروجی کاربران</span></button><button class="btn" data-act="exServices">${ic("download")}<span>خروجی سرویس‌ها</span></button></div>
  <div class="grid two"><div class="card"><div class="chart-h"><h3>${ic("activity")}مصرف در بازه زمانی</h3>${rangeTabs("rep")}</div><div id="ch-rep"></div></div><div class="card"><div class="chart-h"><h3>${ic("users")}رشد کاربران</h3></div><div id="ch-rg"></div></div></div>
  <div class="grid two"><div class="card"><h3>${ic("users")}پرمصرف‌ترین کاربران</h3>${d.items.some(i=>i.used>0)?d.items.map((u,i)=>`<div class="mini"><span class="avatar">${fnum(i+1)}</span><div class="sp"><a href="#/users/${u.id}"><b>${esc(u.name)}</b></a><small>${fnum(u.svc)} سرویس</small></div><b>${fbytes(u.used)}</b></div>`).join(""):empty("users","هنوز مصرفی ثبت نشده است")}</div>
  <div class="card"><h3>${ic("layers")}وضعیت سرویس‌ها</h3>${["active","limited","expired","disabled"].map(k=>`<div class="meter"><div><span>${STATE[k][0]}</span><span>${fnum(st[k]||0)}</span></div>${pbar((st[k]||0)/tot*100)}</div>`).join("")}</div></div>`;
  loadUsage("ch-rep","24h");loadGrow("ch-rg");
};
ACT.exUsers=safe(async()=>{const d=await api("GET","/users?export=1");dlCsv("users.csv",[["نام","شناسه","وضعیت","تعداد سرویس","مصرف (GB)","سهمیه (GB)","تاریخ ثبت","تاریخ انقضا"],...d.items.map(u=>[u.name,u.ident,STATE[u.state][0],u.svc_count,(u.used/1073741824).toFixed(2),u.quota?(u.quota/1073741824).toFixed(2):"نامحدود",fdate(u.created_at),u.expires_at?fdate(u.expires_at):"نامحدود"])])});
ACT.exServices=safe(async()=>{let p=1,all=[];for(;;){const d=await api("GET","/services?page="+p);all=all.concat(d.items);if(p>=d.pages)break;p++}dlCsv("services.csv",[["سرویس","کاربر","سرور","وضعیت","مصرف (GB)","سهمیه (GB)","تاریخ انقضا"],...all.map(s=>[s.name,s.user_name,s.server_name,STATE[s.state][0],(s.used/1073741824).toFixed(2),s.quota?(s.quota/1073741824).toFixed(2):"طبق کاربر",s.eff_expires?fdate(s.eff_expires):"نامحدود"])])});
/* ---------- activity ---------- */
const AQ={q:"",page:1};
PAGES.activity=async my=>{
  setTitle("فعالیت‌های اخیر");
  view.innerHTML=`<div class="toolbar"><div class="search">${ic("search")}<input id="aq" class="inp" placeholder="جستجو در فعالیت‌ها…" value="${esc(AQ.q)}"></div></div><div class="card" id="ta">${skeleton()}</div>`;
  const load=()=>fillList(my,"ta","/activity",AQ,["زمان","مدیر","اقدام","جزئیات","IP"],a=>`<tr><td data-l="زمان">${ftime(a.ts)}</td><td data-l="مدیر">${esc(a.admin)}</td><td data-l="اقدام"><b>${esc(a.action)}</b></td><td data-l="جزئیات">${esc(a.detail)||"—"}</td><td data-l="IP"><small class="ltr">${esc(a.ip)||"—"}</small></td></tr>`,empty("activity",AQ.q?"موردی پیدا نشد":"هنوز فعالیتی ثبت نشده است"));
  LISTS.ta={Q:AQ,load};
  $("#aq").oninput=debounce(e=>{AQ.q=e.target.value.trim();AQ.page=1;load()},300);
  await load();
};
/* ---------- settings ---------- */
PAGES.settings=async my=>{
  const[s,ad]=await Promise.all([api("GET","/settings"),S.admin.role==="owner"?api("GET","/admins"):Promise.resolve({items:[]})]);if(my!==nav)return;setTitle("تنظیمات");
  view.innerHTML=`<div class="grid two"><div class="card"><h3>${ic("shield")}حساب کاربری</h3><div class="kv"><span>نام کاربری</span><b>${esc(S.admin.username)}</b></div><div class="kv"><span>سطح دسترسی</span><span>${S.admin.role==="owner"?"مدیر اصلی":"فقط مشاهده"}</span></div><div class="srv-act"><button class="btn" data-act="pwChange">${ic("lock")}<span>تغییر رمز عبور</span></button><button class="btn danger" data-act="logout">${ic("logout")}<span>خروج</span></button></div></div>
  <div class="card"><h3>${ic("bell")}هشدارها</h3><form id="wf" novalidate>${fld("هشدار انقضا (روز مانده)","warn_days",{value:s.warn_days,attrs:'inputmode="numeric"'})}${fld("هشدار مصرف (درصد سهمیه)","warn_pct",{value:s.warn_pct,attrs:'inputmode="numeric"'})}<div class="form-err" hidden></div><button class="btn primary" type="submit">ذخیره</button></form></div></div>
  ${S.admin.role==="owner"?`<div class="card" style="margin-bottom:14px"><div class="chart-h"><h3>${ic("users")}مدیران</h3><button class="btn primary sm" data-act="adNew">${ic("plus")}<span>مدیر جدید</span></button></div><div class="tw"><table class="tbl"><thead><tr><th>نام کاربری</th><th>سطح دسترسی</th><th>آخرین ورود</th><th></th></tr></thead><tbody>${ad.items.map(a=>`<tr><td data-l="نام کاربری"><b>${esc(a.username)}</b></td><td data-l="سطح">${a.role==="owner"?"مدیر اصلی":"فقط مشاهده"}</td><td data-l="آخرین ورود">${a.last_login?ftime(a.last_login):"—"}</td><td class="acts">${a.id===S.admin.id?"":`<button class="icon-btn d" data-act="adDel" data-id="${a.id}" data-n="${esc(a.username)}">${ic("trash")}</button>`}</td></tr>`).join("")}</tbody></table></div></div>`:""}
  <div class="card"><h3>${ic("server")}سیستم</h3><div class="kv"><span>وضعیت سرویس‌دهی</span>${s.core_running?'<span class="badge ok">در حال اجرا</span>':'<span class="badge err">متوقف</span>'}</div>${s.core_error?`<div class="srv-err">${esc(s.core_error)}</div>`:""}<div class="kv"><span>نسخه پنل</span><span class="ltr">${esc(s.version)}</span></div><div class="srv-act"><button class="btn" data-act="sysApply">${ic("refresh")}<span>اعمال مجدد تنظیمات سرویس‌دهی</span></button></div></div>`;
  const f=$("#wf");f.onsubmit=async e=>{e.preventDefault();const er=$(".form-err",f);er.hidden=true;try{await api("PUT","/settings",{warn_days:normNum(f.warn_days.value),warn_pct:normNum(f.warn_pct.value)});toast("ذخیره شد")}catch(x){er.textContent=x.message;er.hidden=false}};
};
ACT.pwChange=()=>formModal("تغییر رمز عبور",fld("رمز فعلی","current",{type:"password",ltr:1})+fld("رمز جدید","new",{type:"password",ltr:1,hint:"حداقل ۸ کاراکتر"})+fld("تکرار رمز جدید","again",{type:"password",ltr:1}),"تغییر رمز",async(f,m)=>{if(f.new!==f.again)throw new Error("تکرار رمز با رمز جدید یکسان نیست");await api("POST","/me/password",{current:f.current,new:f.new});m.close();toast("رمز عبور تغییر کرد")});
ACT.adNew=()=>formModal("مدیر جدید",fld("نام کاربری","username",{ltr:1})+fld("رمز عبور","password",{type:"password",ltr:1,hint:"حداقل ۸ کاراکتر"})+sel("سطح دسترسی","role",[["owner","مدیر اصلی"],["viewer","فقط مشاهده"]],"viewer"),"افزودن",async(f,m)=>{await api("POST","/admins",f);m.close();toast("مدیر اضافه شد");route()});
ACT.adDel=safe(async d=>{if(!await confirmBox(`مدیر «${d.n}» حذف شود؟`))return;await api("DELETE","/admins/"+d.id);toast("مدیر حذف شد");route()});
ACT.sysApply=safe(async(d,el)=>{el.disabled=true;try{const r=await api("POST","/system/apply",{});toast(r.ok?"تنظیمات اعمال شد":"اجرا با خطا مواجه شد: "+r.error,r.ok?"ok":"err");route()}finally{el.disabled=false}});
/* boot */
(async()=>{try{S.admin=await api("GET","/me")}catch{S.admin=null}S.admin?showShell():showLogin()})();
</script>
</body>
</html>
